name: Checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    env:
      PYTHONPATH: "."
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e "./pipeline[dev,train]"
      - run: python -m pytest -q pipeline/tests
